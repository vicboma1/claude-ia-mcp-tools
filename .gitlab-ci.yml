stages:
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHON_VERSION: "3.11"

cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - python --version
  - pip install --upgrade pip
  - pip install -r requirements.txt

test:
  stage: test
  image: python:${PYTHON_VERSION}
  script:
    - pytest tests/ -v --cov=src --cov-report=term --cov-report=html:htmlcov
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    paths:
      - htmlcov/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    when: always
    expire_in: 30 days
  only:
    - merge_requests
    - main
    - develop

lint:
  stage: test
  image: python:${PYTHON_VERSION}
  script:
    - pip install ruff
    - ruff check src/ tests/
  allow_failure: true
  only:
    - merge_requests
    - main
    - develop

type_check:
  stage: test
  image: python:${PYTHON_VERSION}
  script:
    - pip install mypy
    - mypy src/ --ignore-missing-imports
  allow_failure: true
  only:
    - merge_requests
    - main
    - develop

test_server:
  stage: test
  image: python:${PYTHON_VERSION}
  script:
    - echo '{"jsonrpc":"2.0","method":"initialize","id":1}' | python -m src.example.mcp.server > /tmp/server_test.log 2>&1
    - grep -q '"serverInfo"' /tmp/server_test.log && echo "✓ MCP Server initialized successfully" || exit 1
  artifacts:
    paths:
      - /tmp/server_test.log
    when: always
  only:
    - merge_requests
    - main
    - develop

build_package:
  stage: build
  image: python:${PYTHON_VERSION}
  script:
    - pip install build wheel
    - python -m build
  artifacts:
    paths:
      - dist/
    expire_in: 30 days
  only:
    - tags
    - main

build_docker:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t example-users-mcp:latest .
    - docker build -t example-users-mcp:${CI_COMMIT_SHA} .
  only:
    - tags
    - main
  allow_failure: true

deploy_dev:
  stage: deploy
  image: python:${PYTHON_VERSION}
  script:
    - pip install -r requirements.txt
    - echo "✓ Development deployment ready"
    - echo "  Server: python -m src.example.mcp.server"
  environment:
    name: development
    url: https://dev.example.com
  only:
    - develop
  when: manual

deploy_prod:
  stage: deploy
  image: python:${PYTHON_VERSION}
  script:
    - pip install -r requirements.txt
    - echo "✓ Production deployment ready"
    - echo "  Server: python -m src.example.mcp.server"
  environment:
    name: production
    url: https://example.com
  only:
    - main
    - tags
  when: manual
