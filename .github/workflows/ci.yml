name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================================================
  # TEST STAGE
  # ============================================================================

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=term --cov-report=html:htmlcov

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 5

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Lint with Ruff
        continue-on-error: true
        run: ruff check src/ tests/ || true

      - name: Type check with MyPy
        continue-on-error: true
        run: mypy src/ --ignore-missing-imports || true

  test-server:
    name: Test MCP Server
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test server initialization
        continue-on-error: true
        run: |
          echo '{"jsonrpc":"2.0","method":"initialize","id":1}' | python -m src.example.mcp.server > /tmp/server_test.log 2>&1
          grep -q '"serverInfo"' /tmp/server_test.log && echo "✓ MCP Server initialized successfully" || true

      - name: Test tools/list
        continue-on-error: true
        run: |
          echo '{"jsonrpc":"2.0","method":"tools/list","id":2}' | python -m src.example.mcp.server > /tmp/tools_test.log 2>&1
          grep -q '"tools"' /tmp/tools_test.log && echo "✓ Tools listed successfully" || true

      - name: Upload server test logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: server-test-logs
          path: /tmp/server_test.log
          retention-days: 5

  # ============================================================================
  # BUILD STAGE
  # ============================================================================

  build:
    name: Build Package
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build distribution
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: python-package
          path: dist/
          retention-days: 5

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Check for Dockerfile
        continue-on-error: true
        run: |
          if [ -f Dockerfile ]; then
            echo "Dockerfile found"
          else
            echo "No Dockerfile found, skipping Docker build"
            exit 0
          fi

  # ============================================================================
  # DEPLOY STAGE
  # ============================================================================

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: development
      url: https://dev.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate deployment
        run: |
          echo "✓ Development deployment ready"
          echo "  Server: python -m src.example.mcp.server"

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.event_name == 'push'
    environment:
      name: production
      url: https://example.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate deployment
        run: |
          echo "✓ Production deployment ready"
          echo "  Server: python -m src.example.mcp.server"

  # ============================================================================
  # SUMMARY
  # ============================================================================

  summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Print summary
        run: |
          echo "✅ Workflow completed"
          echo "  - Tests: ${{ github.event.action }}"
          echo "  - Branch: ${{ github.ref }}"
          echo "  - Commit: ${{ github.sha }}"
